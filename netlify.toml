# Netlify configuration for Big Z Burger
#
# Required environment variables (set in Site configuration → Environment variables):
#   VITE_SUPABASE_URL              — Supabase Project URL
#   VITE_SUPABASE_PUBLISHABLE_KEY  — Supabase anon / publishable key
#   VITE_SUPABASE_PROJECT_ID       — (optional) Supabase project ref
#
# See NETLIFY.md for full instructions.

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so deep links / refresh work on client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
